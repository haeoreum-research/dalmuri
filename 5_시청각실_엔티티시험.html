  :root{
    --stage-w: 1680;
    --stage-h: 945;
    --base-bg: #008a87;
  }

  html, body {
    width:100%;
    min-height:100%;
    margin:0;
  }

  body {
    min-height:100vh;
    overflow:hidden;
    background: var(--base-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:-0.04em;
    font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace;
  }

  #qheading { display:none; }

  /* 레퍼런스 화면 비율을 그대로 유지하는 고정 무대 */
  #stage {
    position:fixed;
    left:50%;
    top:50%;
    width:1680px;
    height:945px;
    background: var(--base-bg);
    overflow:hidden;
    transform-origin:center center;
    will-change:transform;
  }

  .window {
    box-sizing:border-box;
  }

  /* ── 문제 영역 : Win98 창 없이 배경 위에 바로 놓이는 단순 중앙 정렬 레이아웃 ── */
  #qArea {
    position:absolute; inset:0;
  }
  #qProgress {
    position:absolute; top:35px; left:50%; transform:translateX(-50%);
    font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important;
    color:#fff; font-size:18px; font-weight:bold; text-align:center; opacity:.75;
  }
  #dialogHeading {
    position:absolute; top:90px; left:50%; transform:translateX(-50%);
    width:1200px; box-sizing:border-box;
    font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important;
    color:#fff; font-size:23px; font-weight:bold; text-align:center; line-height:1.5;
  }
  #qImageWrap {
    position:absolute; top:175px; left:50%; transform:translateX(-50%);
    width:560px; height:420px;
    display:flex; align-items:center; justify-content:center;
    background:#000; flex-shrink:0;
    border:2px solid; border-color:#fff #404040 #404040 #fff;
    box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  }
  #qImageWrap img { display:block; width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
  #qImageWrap .noimg { color:#ccc; font-size:15px; line-height:1.9; text-align:center; padding:20px; }

  #choices {
    position:absolute; top:615px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:8px; align-items:flex-start;
  }
  #choices div {
    font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important;
    display:flex; align-items:center; gap:10px;
    font-size:19px; font-weight:bold; color:#fff; white-space:normal;
  }

  /* ── 입력 영역 ── */
  #answerWrap {
    position:absolute; top:615px; left:50%; transform:translateX(-50%);
    width:800px; box-sizing:border-box;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  /* 보기(선택지)가 있는 문제는 보기 텍스트가 그 자리를 차지하므로, 입력칸을 보기 아래쪽 자리로 내림 */
  #answerWrap.shifted { top:735px; }
  #answerInput, .word-input {
    height:46px !important;
    padding:0 12px !important;
    box-sizing:border-box !important;
    background:#fff !important;
    color:#000 !important;
    font-size:19px !important;
    font-weight:bold !important;
    text-align:center !important;
    outline:none !important;
    border:2px solid !important;
    border-color:#707070 #fff #fff #707070 !important;
    box-shadow:inset 1px 1px 3px rgba(0,0,0,.4) !important;
    font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important;
  }
  #answerInput.error, .word-input.error { color:#a00000; }
  #answerInput.ok, .word-input.ok { color:#006400; }

  /* 문장형 정답용 — 단어마다 칸을 나눠 띄어쓰기를 힌트로 보여줌.
     자동으로 다음 칸에 넘어가지 않으며, Tab을 눌러야만 다음 칸으로 이동함 */
  #sentenceInputs { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .sent-row { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }

  .gf-errmsg {
    visibility:hidden;
    min-height:1.4em;
    color:#fff;
    font-size:15px;
  }
  .gf-errmsg.on { visibility:visible; }
  .subhint {
    color:#fff;
    font-size:14px;
    font-weight:bold;

  @keyframes okflash { 0%,80%{ box-shadow:0 0 0 4px #00c800;} 100%{ box-shadow:0 0 0 0 transparent;} }
  .okflash { animation:okflash .7s; }
  @keyframes errflash { 0%,80%{ box-shadow:0 0 0 4px #dc0000;} 100%{ box-shadow:0 0 0 0 transparent;} }

     그 -50% 중앙정렬 값이 애니메이션 도중 덮어써져 오른쪽으로 튀어나가 보였음 — 정렬값을 유지한 채 흔들리도록 전용 키프레임 사용 */
  @keyframes qimgErrShake {

    40% { transform: translateX(calc(-50% + 8px)); }

    80% { transform: translateX(calc(-50% + 4px)); }

  /* 최종 완료 */

     실제로는 더 두껍게/강조돼 보였음. 이제 시각적으로는 완전히 구분 불가능함 */

<script>
const QUESTIONS = [

  { image:'images/ntt/ntt08.png',
    heading:'환자의 상태로 가장 알맞은 것은 몇 번입니까?',
    choices:['안정적으로 깊이 잠들어 있다.','외부 자극에 반응하며 강한 불안 상태다.','단순 진료를 기다리는 중이다.'],
    answer:'2' },
  { image:'images/ntt/ntt09.png',
    heading:'사진 속 실종자 중 20대는 몇 명입니까?',
    choices:[], answer:'5' },
  { image:'images/ntt/ntt10.png',
    heading:'TAPE4에서 들리는 문장을 그대로 입력하세요.',
    choices:[], answer:'제발 이 연구소를 멈춰주세요.' },
];

const HIDDEN_WORD = ['보','안','실','금','고','일','칠','팔','칠','팔','일'];
const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
let qi = 0, locked = false;
const $ = id => document.getElementById(id);
const input = $('answerInput');

/* ── 제작진 단계 이동 시, 이전 문제의 정답/오답 연출 타이머가 뒤늦게 화면을
   바꾸지 않도록 추적/정리 ── */
let crewTimers = [];
function crewTimeout(fn, ms){ const id = setTimeout(fn, ms); crewTimers.push(id); return id; }
function crewClearTimers(){ crewTimers.forEach(clearTimeout); crewTimers = []; }

$('qImage').addEventListener('click', ()=>{
  const img = $('qImage');
  if(!img.naturalWidth) return;
  $('fsImg').src = img.src;
  $('fullscreenImg').classList.add('show');
});
$('fullscreenImg').addEventListener('click', ()=> $('fullscreenImg').classList.remove('show'));
function fitStage(){
  const stage = $('stage');
  const scale = Math.min(window.innerWidth / 1680, window.innerHeight / 945);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

/* ══════════════════════════════════════════════════════════════
   정답 판정 — 오타 허용 로직
   ══════════════════════════════════════════════════════════════ */

/** 공백·마침표를 전부 제거하고 앞뒤 공백도 정리 */
function normalizeText(text){
  return String(text).trim().replace(/\s+/g, '').replace(/\./g, '');
}

/** Damerau-Levenshtein 거리 (삽입/삭제/치환/인접 전치 4종을 모두 1 비용으로 계산) */
function damerauLevenshtein(a, b){
  const al = a.length, bl = b.length;
  if(al === 0) return bl;
  if(bl === 0) return al;
  const d = Array.from({length: al + 1}, () => new Array(bl + 1).fill(0));
  for(let i = 0; i <= al; i++) d[i][0] = i;
  for(let j = 0; j <= bl; j++) d[0][j] = j;
  for(let i = 1; i <= al; i++){
    for(let j = 1; j <= bl; j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      d[i][j] = Math.min(
        d[i-1][j]   + 1,     // 삭제
        d[i][j-1]   + 1,     // 삽입
        d[i-1][j-1] + cost   // 치환(같으면 비용 0)
      );
      if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]){
        d[i][j] = Math.min(d[i][j], d[i-2][j-2] + cost);   // 인접 두 글자 순서 바뀜
      }
    }
  }
  return d[al][bl];
}

/** 문장 길이에 비례해 허용 오차를 정함 — 최소 1글자, 최대 3글자, 대략 길이/10 반올림 */
function toleranceFor(len){
  return Math.min(3, Math.max(1, Math.round(len / 10)));
}

/** 두 문장(공백/마침표 제거 후)을 비교해 오타 허용 범위 안이면 true */
function isCloseEnough(userInput, correctAnswer){
  const a = normalizeText(userInput);
  const b = normalizeText(correctAnswer);
  if(!a) return false;
  if(a === b) return true;
  const dist = damerauLevenshtein(a, b);
  return dist <= toleranceFor(b.length);
}

/** 문장형 정답은 오타 허용 비교, 숫자/단답형 정답은 기존처럼 정확히 일치해야 함 */
function checkAnswer(userInput, correctAnswer, isSentence){
  if(isSentence) return isCloseEnough(userInput, correctAnswer);
  return normalizeText(userInput).toLowerCase() === normalizeText(correctAnswer).toLowerCase();
}

/** 정답에 공백이 있으면(=문장형) true — 숫자/단답형과 구분하는 기준 */
function isSentenceAnswer(answer){
  return /\s/.test(answer.trim());
}

function loadQ(){
  const q = QUESTIONS[qi];
  $('qProgress').textContent = `문제 ${qi + 1}`;
  $('qheading').textContent = q.heading;
  $('dialogHeading').textContent = q.heading;
  $('choices').innerHTML = q.choices.map((c,i)=> `<div><span class="cnum">${CIRCLED[i]}</span><span class="ctext">${c}</span></div>`).join('');
  $('choices').style.display = q.choices.length ? '' : 'none';
  $('answerWrap').classList.toggle('shifted', q.choices.length > 0);
  $('subhint').textContent = '숫자 또는 내용을 입력하세요.';

  const qImageWrap = $('qImageWrap');
  const img = $('qImage');
  img.style.display = 'block';
  qImageWrap.querySelector('.noimg')?.remove();
  img.onerror = ()=>{
    img.style.display = 'none';
    const noimg = document.createElement('div');
    noimg.className = 'noimg';
    noimg.innerHTML = `[ 이미지 준비 중 ]<br>${q.image}`;
    qImageWrap.appendChild(noimg);
  };
  img.src = q.image;

  input.value = '';
  input.maxLength = q.answer.length;
  input.classList.remove('error','ok');

  if(isSentenceAnswer(q.answer)){
    input.style.display = 'none';
    renderSentenceInputs(q);
  } else {
    $('sentenceInputs').innerHTML = '';
    input.style.display = '';
    input.style.width = Math.max(q.answer.length * 20 + 26, 46) + 'px';
    input.focus();
  }
}

input.addEventListener('input', e=>{
  if(e.isComposing) return;
  input.classList.remove('error');
});
input.addEventListener('keydown', e=>{
  if(e.isComposing || e.keyCode === 229) return;
  if(e.key === 'Enter'){ e.preventDefault(); check(); }
});
document.getElementById('submitBtn').addEventListener('click', check);

/** 정답 문장을 줄바꿈(\n) → 그 안에서 띄어쓰기로 나눠, 줄마다 별도의 입력칸 행을 만듦.
    Tab으로만 다음 칸으로 이동하며, 자동으로 넘어가는 동작은 전혀 없음 */
function renderSentenceInputs(q){
  const container = $('sentenceInputs');
  container.innerHTML = '';
  q.answer.split('\n').forEach(line=>{
    const row = document.createElement('div');
    row.className = 'sent-row';
    line.trim().split(/\s+/).forEach(word=>{
      const core = word.replace(/\.$/, '');
      const box = document.createElement('input');
      box.type = 'text';
      box.className = 'word-input';
      box.autocomplete = 'off';
      box.spellcheck = false;
      box.maxLength = core.length;
      box.style.width = Math.max(core.length * 20 + 26, 46) + 'px';
      row.appendChild(box);
    });
    container.appendChild(row);
  });
  container.querySelector('.word-input')?.focus();
}

$('sentenceInputs').addEventListener('input', e=>{
  if(!e.target.classList.contains('word-input') || e.isComposing) return;
  e.target.classList.remove('error');
});
$('sentenceInputs').addEventListener('keydown', e=>{
  if(!e.target.classList.contains('word-input') || e.isComposing || e.keyCode === 229) return;
  if(e.key === 'Enter'){ e.preventDefault(); check(); }
  if(e.key === 'Backspace' && e.target.value === ''){
    const boxes = [...document.querySelectorAll('.word-input')];
    const idx = boxes.indexOf(e.target);
    if(idx > 0) boxes[idx-1].focus();
  }
});

document.addEventListener('click', ()=>{
  const boxes = document.querySelectorAll('.word-input');
  if(boxes.length){
    if(![...boxes].includes(document.activeElement)) boxes[0].focus();
  } else {
    input.focus();
  }
});

function check(){
  if(locked) return;
  const q = QUESTIONS[qi];
  const sentence = isSentenceAnswer(q.answer);
  const targets = sentence ? [...document.querySelectorAll('.word-input')] : [input];
  const val = sentence ? targets.map(b=>b.value).join(' ').trim() : input.value.trim();
  if(!val) return;
  const correct = checkAnswer(val, q.answer, sentence);
  if(correct){
    locked = true;
    targets.forEach(t => t.classList.add('ok'));
    $('qImageWrap').classList.add('okflash');
    crewTimeout(()=>{
      $('qImageWrap').classList.remove('okflash');
      locked = false;
      qi++;
      GF_CREW.setCurrent(qi);
      if(qi >= QUESTIONS.length){ showHiddenFx(); }
      else loadQ();
    }, 700);
  } else {
    locked = true;
    targets.forEach(t => t.classList.add('error'));
    $('qImageWrap').classList.add('errflash');
    $('errmsg').classList.add('on');
    crewTimeout(()=>{
      $('qImageWrap').classList.remove('errflash');
      $('errmsg').classList.remove('on');
      targets.forEach(t => { t.value=''; t.classList.remove('error'); });
      locked = false;
      if(sentence) targets[0]?.focus();
      else input.focus();
    }, 1000);
  }
}

function buildHiddenGrid(){
  const grid = $('hiddenGrid');
  grid.innerHTML = '';

  // 가로 29칸이 항상 나오도록 화면 폭에 비례해서 글자 크기·폭·간격을 직접 계산
  // (전에 알려주신 기준 이미지가 가로 29개였음 — 이제 화면 크기가 달라져도 항상 이 비율을 유지함)
  const TARGET_COLS = 55;
  const unit = window.innerWidth / TARGET_COLS;   // 글자 하나가 차지하는 총 폭(글자+간격)
  const fontPx  = unit * 0.72;
  const widthPx = unit * 0.78;
  const gapPx   = unit * 0.22;
  document.documentElement.style.setProperty('--hchar-size', fontPx + 'px');
  document.documentElement.style.setProperty('--hchar-width', widthPx + 'px');
  document.documentElement.style.setProperty('--hrow-gap', gapPx + 'px');

  // 셀 크기를 추정치가 아니라 실제 렌더링 크기로 직접 측정 — 폰트 메트릭에 따라 달라져도 항상 화면에 정확히 맞도록 함
  const probe = document.createElement('span');
  probe.className = 'hchar';
  probe.textContent = '끝';
  probe.style.visibility = 'hidden';
  probe.style.position = 'fixed';
  document.body.appendChild(probe);
  const rect = probe.getBoundingClientRect();
  document.body.removeChild(probe);
  const cellW = rect.width + gapPx;    // .hrow gap 값과 일치
  const cellH = rect.height + 14;   // #hiddenGrid gap 값과 일치

  const cols = Math.ceil(window.innerWidth / cellW) + 2;
  const minRows = Math.ceil(window.innerHeight / cellH);
  const rowOverflow = 6;              // 위아래로 살짝 더 채우는 여유분(센터링되면서 화면 밖으로 크롭됨)
  const rows = minRows + rowOverflow;
  // 숨은 글자는 크롭되는 여유 행을 피해 "실제로 화면에 보이는" 행 범위 안에서만 배치
  const visTop = Math.floor(rowOverflow / 2);
  const visBottom = rows - Math.ceil(rowOverflow / 2);
  const marginR = 1, marginC = Math.floor(cols * 0.25);   // 좌우는 가운데 쪽 50% 범위로 좁힘
  const bandTop = visTop + marginR;
  const bandBottom = visBottom - marginR;
  const usableRows = Math.max(HIDDEN_WORD.length, bandBottom - bandTop);
  const rowsPerChar = usableRows / HIDDEN_WORD.length;
  const hiddenPos = HIDDEN_WORD.map((_, i) => {
    const bandStart = bandTop + Math.floor(i * rowsPerChar);
    const bandEnd = Math.max(bandStart + 1, bandTop + Math.floor((i + 1) * rowsPerChar));
    return {
      r: Math.min(bandBottom - 1, bandStart + Math.floor(Math.random() * (bandEnd - bandStart))),
      c: marginC + Math.floor(Math.random() * Math.max(1, cols - marginC * 2)),
    };
  });
  for(let r=0;r<rows;r++){
    const row = document.createElement('div');
    row.className = 'hrow';
    for(let c=0;c<cols;c++){
      const span = document.createElement('span');
      const hIdx = hiddenPos.findIndex(p=>p.r===r && p.c===c);
      span.className = hIdx !== -1 ? 'hchar secret' : 'hchar';
      span.textContent = hIdx !== -1 ? HIDDEN_WORD[hIdx] : '끝';
      row.appendChild(span);
    }
    grid.appendChild(row);
  }
}
function showHiddenFx(){
  const start = ()=>{
    buildHiddenGrid();
    $('hiddenFx').classList.add('show');
    // 옛날 컴퓨터 로딩처럼 줄마다 뚝뚝 끊어지며 위에서 아래로 순서대로 나타남 (부드러운 페이드 없음)
    const rows = [...document.querySelectorAll('.hrow')];
    rows.forEach((row, i) => {
      crewTimeout(()=> row.classList.add('show'), i * 40);
    });
  };
  // 임베드 폰트 로딩이 끝난 뒤에 측정해야 정확함 (로딩 전엔 대체 폰트 크기로 측정될 수 있음)
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(start);
  else start();
}

/* ══════════════ 제작진용 단계 이동 패널 (assets/crew.js) ══════════════
   1~10번 문제 → 11.숨은 글자 연출(마지막)
   ※ 기존에 있던 Ctrl+Shift+화살표/Home/End 단축키는 새 공통 단축키(Ctrl+Shift+Alt+…)로 대체됨 */
function crewResetAll(){
  crewClearTimers();
  locked = false;
  $('qImageWrap').classList.remove('okflash','errflash');
  $('errmsg').classList.remove('on');
  $('fullscreenImg').classList.remove('show');
  $('hiddenFx').classList.remove('show');
}
function crewStep(n){
  crewResetAll();
  if(n >= QUESTIONS.length){
    qi = QUESTIONS.length;
    showHiddenFx();
  } else {
    qi = n;
    loadQ();
  }
}
