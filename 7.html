<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>생체 인증 시스템</title>
<link rel="stylesheet" href="assets/98.css?v=4">
<link rel="stylesheet" href="assets/theme.css?v=4">
<style>
  body { background:#008080; letter-spacing:-0.05em; display:flex; align-items:center; justify-content:center;
         font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important; }

  /* 공용 CSS(theme.css)의 .window/.title-bar 기본값(갈무리체, use-pret 페이지는 이 보정에서 빠져있음)이
     body보다 더 구체적인 선택자라 이겨버려서, 제목표시줄·본문 텍스트가 전부 갈무리체로 나오고 있었음
     → 이 파일은 전체를 둥근모체로 통일 (같은 우선순위일 때 나중에 로드되는 규칙이 이기므로 여기서 재지정) */
  .window, .title-bar { font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important; }

  /* ── 메인 창 (Windows98 윈도우로 감쌈) ── */
  #mainWin { width:min(720px, 94vw); }
  #mainWin .window-body { padding:28px 32px 32px; }

  #wrap { text-align:center; }
  .headmsg { font-size:30px; line-height:1.6; margin-bottom:22px; color:#000; }
  /* 굵은 글자(<b>)가 공용 CSS에서 갈무리 폰트+다른 세로 위치로 지정돼 있어 둥근모/기본 베이스라인으로 명시적으로 고정 */
  .headmsg b {
    font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important;
    font-size:inherit !important;
    line-height:inherit !important;
    vertical-align:baseline !important;
    position:static !important;
    top:auto !important;
    color:#000;
  }

  /* 스캔 영역 (기존 시스템 그대로 유지, 크기만 최대치를 키움) */
  #scanbox { width:min(520px, 82vw); height:min(660px, 58vh); margin:0 auto; position:relative; overflow:hidden;
             background:#000; border:2px solid #1c3a66;
             box-shadow:0 0 50px rgba(60,120,255,.18), inset 0 0 40px rgba(60,120,255,.08); }
  #cam, #noise { position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:cover;
                 transform:scaleX(-1); filter:contrast(1.15) saturate(.9) brightness(1.1); }

  /* 얼굴 실루엣 오버레이 */
  #silhouette { position:absolute; top:0; right:0; bottom:0; left:0; z-index:3; pointer-events:none; }

  /* 코너 브래킷 — 더 밝고 두껍게 */
  .corner { position:absolute; width:48px; height:48px; z-index:4; border:5px solid #74b3ff; }
  .c1 { top:10px; left:10px; border-right:none; border-bottom:none; }
  .c2 { top:10px; right:10px; border-left:none; border-bottom:none; }
  .c3 { bottom:10px; left:10px; border-right:none; border-top:none; }
  .c4 { bottom:10px; right:10px; border-left:none; border-top:none; }

  /* 스캔 라인 */
  #scanline { position:absolute; left:0; right:0; height:3px; z-index:4;
              background:linear-gradient(90deg, transparent, #74b3ff 20%, #d8ecff 50%, #74b3ff 80%, transparent);
              box-shadow:0 0 22px #74b3ff; animation:scanmove 3.2s ease-in-out infinite; }
  @keyframes scanmove { 0%,100% { top:4%; } 50% { top:94%; } }

  #status { margin-top:8px; font-size:17px; letter-spacing:3px; color:#8ec4ff;
            text-shadow:0 0 10px rgba(120,180,255,.8);
            animation:gfPulse 1.4s infinite; position:absolute; bottom:14px; left:0; right:0; z-index:5; }

  /* 오답 시 인식창 전체가 은은하게 어두워지고, 맥동하는 붉은 글로우 테두리 + 정제된 경고 문구가 뜸 */
  #scanError { position:absolute; top:0; right:0; bottom:0; left:0; z-index:6; display:none; align-items:center; justify-content:center;
               background:rgba(8,2,2,.74); }
  #scanError.show { display:flex; }
  #scanError::after { content:''; position:absolute; top:0; right:0; bottom:0; left:0; pointer-events:none;
               border:3px solid rgba(255,60,60,.85);
               box-shadow:0 0 38px rgba(255,30,30,.55), inset 0 0 32px rgba(255,20,20,.3);
               animation:errPulse 1s ease-in-out infinite; }
  @keyframes errPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  #scanError .errText { position:relative; z-index:1;
               font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important;
               color:#ff5757; font-size:30px; font-weight:bold; letter-spacing:4px;
               text-shadow:0 0 16px rgba(255,50,50,.85);
               padding:14px 30px;
               border-top:1px solid rgba(255,100,100,.55);
               border-bottom:1px solid rgba(255,100,100,.55); }

  .footmsg { margin-top:22px; font-size:19px; line-height:1.6; color:#333; }

  /* ── 카메라 시작 게이트 (iOS/iPadOS Safari는 사용자의 탭 제스처가 있어야
       카메라 권한·자동재생이 안정적으로 동작하므로, 자동 연결이 막히면
       이 오버레이가 뜨고 탭하면 그 탭 이벤트 안에서 즉시 재시도합니다) ── */
  #camGate { position:absolute; top:0; right:0; bottom:0; left:0; z-index:7; display:none;
             align-items:center; justify-content:center; background:rgba(4,10,20,.86); padding:20px; }
  #camGate.show { display:flex; }
  .camgate-box { text-align:center; }
  .camgate-msg { font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important;
                 color:#dce9ff; font-size:16px; line-height:1.6; letter-spacing:1px;
                 white-space:pre-line; margin-bottom:16px; text-shadow:0 0 8px rgba(120,180,255,.6); }
  .camgate-btn { font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important;
                 font-size:16px; padding:10px 26px; cursor:pointer;
                 background:#c0c0c0; border:2px solid; border-color:#dfdfdf #404040 #404040 #dfdfdf;
                 box-shadow:0 0 18px rgba(116,179,255,.35); color:#000; }
  .camgate-btn:active { border-color:#404040 #dfdfdf #dfdfdf #404040; }

  /* ── 디버그 패널 (주소 끝에 ?debug=1 을 붙이면 표시, 카메라 연결 실패 원인 확인용) ── */
  #debugPanel { position:fixed; left:8px; bottom:8px; z-index:99999; display:none;
                max-width:70vw; max-height:40vh; overflow:auto;
                background:rgba(0,0,0,.82); color:#7CFC7C; font-family:'Consolas','Menlo','Courier New',monospace;
                font-size:11px; line-height:1.5; white-space:pre-wrap; padding:8px 10px; border:1px solid #3a3a3a; }
  #debugPanel.show { display:block; }

  /* ── 판정 팝업 (Windows98 시스템 메시지 스타일) ── */
  #popupBackdrop { position:fixed; top:0; right:0; bottom:0; left:0; z-index:8900; background:rgba(0,0,0,.45); display:none; }
  #popupBackdrop.show { display:block; }
  .popupwin { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9000;
              width:520px; max-width:90vw; display:none; }
  .popupwin.show { display:block; }
  .msgpanel { display:flex; align-items:center; border:1px solid #868686; box-shadow:inset 1px 1px 0 #fff;
              padding:24px 26px; }
  .msgicon { width:58px; height:58px; border-radius:50%; background:#0047ff; border:3px solid #001a8c;
             flex:none; margin-right:22px; display:flex; align-items:center; justify-content:center; }
  .msgicon::after { content:'i'; color:#fff; font-family:Georgia,'Times New Roman',serif; font-style:italic;
                     font-weight:bold; font-size:36px; line-height:1; }
  .msgtitle { font-family:'DungGeunMo', 'MS Gothic', '굴림', monospace !important; font-size:27px; font-weight:bold; color:#000; margin-bottom:10px; }
  .msgbody  { font-size:20px; color:#000; line-height:1.5; }

  /* ── 승인 팝업 : 안면 인식 완료 문구(가운데 정렬) + 로딩 스피너 + 출입문 개방 안내 문구 ── */
  #grant { width:420px; }
  #grant .msgpanel { justify-content:center; }
  #grant .msgbody { text-align:center; font-size:28px; font-weight:bold; }
  .spinner { position:relative; width:60px; height:60px; margin:20px auto 22px; }
  .spinner i { position:absolute; top:0; left:50%; width:6px; height:16px; margin-left:-3px;
               background:#000; border-radius:3px; transform-origin:3px 30px;
               animation:spinFade 1.2s linear infinite; }
  @keyframes spinFade { 0%{opacity:1;} 100%{opacity:.15;} }
  .doorcount { font-size:21px; color:#333; text-align:center; }

  /* ── 출입문 개방 완료 팝업 : 화면 정중앙보다 살짝 아래에 위치 ── */
  #doorOpen { top:46%; }
</style>
</head>
<body class="crt use-pret">

<div class="window" id="mainWin">

    <div class="title-bar-controls">

        <canvas id="noise" class="gf-hidden"></canvas>

          <defs>

              <ellipse cx="220" cy="465" rx="165" ry="80" fill="#000"/>

          </defs>

<!-- 승인 / 거부 연출 (진행자 조작) — Windows98 팝업 -->

<div class="window popupwin" id="doorOpen">

  <div class="window-body">
    <div class="msgpanel">
      <div class="msgicon"></div>
      <div>
        <div class="msgtitle" style="letter-spacing:3px;">DOOR UNLOCKED</div>
        <div class="msgbody">출입 승인 완료.<br>출입문이 개방되었습니다.</div>

<div id="debugPanel"></div>

<script src="assets/common.js?v=4"></script>
<script>
/* ═══════════════ 운영 설정 (여기만 수정하면 됩니다) ═══════════════
   ▶ 진행자 원격 조작 (무선 키보드 권장) :
      Space(스페이스바) = 승인(ACCESS GRANTED) 팝업 → DOOR_OPEN_MS 뒤 자동으로
                          "출입문 개방 완료" 팝업으로 전환
      X                 = 오답 연출(인식창이 붉게 흔들리며 "안면 데이터 불일치") → 3초 후 자동 복귀
      L                 = 맨 마지막 화면("출입문 개방 완료" 팝업)으로 즉시 이동 (승인 대기 생략)
      Esc               = 모든 팝업/연출 즉시 해제 (대기 중인 "출입문 개방" 타이머도 함께 취소됨)
   GRANT_HOLD_MS : 승인 연출 유지 시간 (0 = 수동 해제(Esc)까지 유지). "출입문 개방" 자동 전환과는
                   별개 타이머이므로, 이 값 때문에 승인 팝업이 먼저 사라지더라도 DOOR_OPEN_MS가
                   지나면 "출입문 개방 완료" 팝업은 그대로 뜹니다(Esc로 취소하지 않는 한).
   DOOR_OPEN_MS  : 승인(Space) 후 "출입문 개방 완료" 팝업이 뜨기까지의 실제 대기 시간
                   (밀리초, 기본 60000 = 60초). 화면에 표시되는 "○○초 후..." 문구도 이 값을
                   그대로 사용하므로 값만 바꾸면 문구도 자동으로 맞춰집니다.
   ※ 아이패드(Safari)에서 카메라가 자동으로 붙지 않으면 화면에 "카메라 시작" 버튼이
      뜹니다 — 한 번 탭해서 권한을 허용하면 그 뒤로는 계속 연결된 채로 유지됩니다.
   ※ 주소 끝에 ?debug=1 을 붙여서 열면 좌하단에 실제 오류 원인이 표시됩니다.
*/
const GRANT_HOLD_MS = 0;
const DOOR_OPEN_MS  = 60000;
/* ═══════════════════════ 설정 끝 ═══════════════════════ */

const $ = id => document.getElementById(id);
$('doorCountText').textContent = Math.round(DOOR_OPEN_MS/1000) + '초 후 출입문이 열립니다.';

/* ── 디버그 모드 ── */
const DEBUG = /(?:^|[?&])debug=1(?:&|$)/.test(location.search);
function dbg(msg){
  if(!DEBUG) return;
  const el = $('debugPanel');
  el.classList.add('show');
  const t = new Date().toLocaleTimeString();
  el.textContent += `[${t}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}
if(DEBUG){
  dbg('UA: ' + navigator.userAgent);
  dbg('location: ' + location.protocol + '//' + location.host);
  dbg('isSecureContext: ' + window.isSecureContext);
}

/* ── 카메라 연결 (iOS/iPadOS Safari 대응) ──
   - https(또는 localhost)가 아니면 getUserMedia 자체가 막히므로 먼저 확인
   - facingMode는 엄격한 조건 → 느슨한 조건 순으로 단계적으로 재시도
   - srcObject 연결 후 video.play()를 명시적으로 호출하고, 자동재생이
     막히면(특히 최초 권한 허용 직후의 iOS) "탭하여 시작" 게이트를 띄워
     그 탭 이벤트 안에서 다시 play()를 호출 — 이 방식이 iOS Safari에서
     가장 안정적으로 동작합니다.
   - 권한 거부 / 카메라 없음 / 다른 앱에서 사용 중 등 원인별로 안내문을 다르게 표시 */
let camStream = null;

function isSecureContextOk(){
  if(window.isSecureContext) return true;
  return location.hostname === 'localhost' || location.hostname === '127.0.0.1';
}

function showGate(msg, retryFn){
  $('camGateMsg').textContent = msg;
  const btn = $('camGateBtn');
  if(retryFn){
    btn.classList.remove('gf-hidden');
    btn.onclick = function(){ retryFn(); };
  } else {
    btn.classList.add('gf-hidden');
  }
  $('camGate').classList.add('show');
}
function hideGate(){ $('camGate').classList.remove('show'); }

function setStatus(t){ $('status').textContent = t; }

function fallbackToNoise(){
  $('cam').classList.add('gf-hidden');
  const c = $('noise');
  c.classList.remove('gf-hidden');
  noise(c);
}

async function startCam(){
  hideGate();
  if(!isSecureContextOk()){
    setStatus('CAMERA STANDBY . . .');
    fallbackToNoise();
    dbg('blocked: not a secure context (need https or localhost)');
    showGate('보안 연결(https)이 아니어서\n카메라를 사용할 수 없습니다.', null);
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('CAMERA STANDBY . . .');
    fallbackToNoise();
    dbg('blocked: getUserMedia unsupported on this browser');
    showGate('이 브라우저에서는\n카메라를 지원하지 않습니다.', null);
    return;
  }

  setStatus('CONNECTING . . .');
  const attempts = [
    { video:{ facingMode:{ideal:'user'}, width:{ideal:1280} }, audio:false },
    { video:{ facingMode:'user' }, audio:false },
    { video:true, audio:false }
  ];
  let stream = null, lastErr = null;
  for(const constraints of attempts){
    try{
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      lastErr = null;
      break;
    }catch(e){
      lastErr = e;
      dbg('getUserMedia attempt failed: ' + e.name + ' — ' + e.message);
      if(e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError' ||
         e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError' ||
         e.name === 'NotReadableError' || e.name === 'TrackStartError' ||
         e.name === 'SecurityError'){
        break; // 조건을 완화해도 해결되지 않는 오류이므로 재시도 중단
      }
    }
  }

  if(!stream){
    setStatus('CAMERA STANDBY . . .');
    fallbackToNoise();
    const name = lastErr && lastErr.name;
    let msg = '카메라를 시작할 수 없습니다.\n화면을 탭해 다시 시도하세요.';
    if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
      msg = '카메라 권한이 거부되었습니다.\n설정 > Safari > 카메라에서 허용 후\n다시 탭해주세요.';
    } else if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
      msg = '카메라 장치를 찾을 수 없습니다.';
    } else if(name === 'NotReadableError' || name === 'TrackStartError'){
      msg = '카메라가 다른 앱에서 사용 중입니다.\n다른 앱을 종료한 뒤 다시 시도하세요.';
    } else if(name === 'OverconstrainedError' || name === 'ConstraintNotSatisfiedError'){
      msg = '카메라 설정을 적용할 수 없습니다.\n다시 시도하세요.';
    }
    dbg('final failure: ' + (name || 'unknown'));
    showGate(msg, startCam);
    return;
  }

  camStream = stream;
  const video = $('cam');
  video.srcObject = stream;
  video.muted = true;
  attemptPlay(video);
}

function attemptPlay(video){
  const p = video.play();
  if(p && typeof p.then === 'function'){
    p.then(onCamReady).catch(function(err){
      dbg('video.play() blocked: ' + (err && err.name));
      showGate('화면을 탭하여 시작하십시오', function(){
        attemptPlay(video);
      });
    });
  } else {
    onCamReady();
  }
}

function onCamReady(){
  hideGate();
  $('cam').classList.remove('gf-hidden');
  $('noise').classList.add('gf-hidden');
  setStatus('SCANNING . . .');
  dbg('camera ready and playing');
}

function noise(canvas){
  const ctx = canvas.getContext('2d');
  canvas.width = 220; canvas.height = 280;
  const img = ctx.createImageData(220,280);
  (function frame(){
    const d = img.data;
    for(let i=0;i<d.length;i+=4){ const v = Math.random()*90|0; d[i]=v; d[i+1]=v+8; d[i+2]=v+22; d[i+3]=255; }
    ctx.putImageData(img,0,0);
    requestAnimationFrame(frame);
  })();
}
startCam();

/* ── 팝업 열기/닫기 ── */
let doorTimer = null;
function cancelDoorTimer(){
  clearTimeout(doorTimer);
  doorTimer = null;
}
function closePopups(){
  $('grant').classList.remove('show');
  $('doorOpen').classList.remove('show');
  $('popupBackdrop').classList.remove('show');
  $('scanError').classList.remove('show');
  $('mainWin').style.display = '';   // 생체 인증 시스템 창 다시 표시
}
function showDoorOpen(){
  doorTimer = null;
  $('grant').classList.remove('show');
  $('popupBackdrop').classList.add('show');
  $('doorOpen').classList.add('show');
  $('mainWin').style.display = 'none';   // 출입문 개방 완료 팝업만 보이도록 뒤쪽 창을 숨김
}
$('grantClose').onclick    = ()=>{ closePopups(); cancelDoorTimer(); };
$('doorOpenClose').onclick = ()=>{ closePopups(); cancelDoorTimer(); };

/* ── 진행자 조작 (무선 키보드로 즉시 연출) ──
   물리 키 코드(e.code)로 판별해 한/영 전환 상태와 무관하게 항상 동작하고,
   키를 길게 눌러도 반복 실행되지 않도록 e.repeat을 걸러냄.
   Ctrl/Alt/Meta가 함께 눌린 경우(다른 단축키 조합)는 무시함 */
document.addEventListener('keydown', e=>{
  if(e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  if(e.code === 'Space'){
    e.preventDefault();
    cancelDoorTimer();
    $('scanError').classList.remove('show');
    $('doorOpen').classList.remove('show');
    $('mainWin').style.display = '';   // 이전 주기에서 숨겨져 있었다면 다시 표시
    $('popupBackdrop').classList.add('show');
    $('grant').classList.add('show');
    doorTimer = setTimeout(showDoorOpen, DOOR_OPEN_MS);
    if(GRANT_HOLD_MS > 0) setTimeout(closePopups, GRANT_HOLD_MS);
  }
  else if(e.code === 'KeyX'){
    cancelDoorTimer();
    $('grant').classList.remove('show');
    $('doorOpen').classList.remove('show');
    $('popupBackdrop').classList.remove('show');
    $('mainWin').style.display = '';   // 이전 주기에서 숨겨져 있었다면 다시 표시
    $('scanError').classList.add('show');
    GF.shake($('scanbox'));
    setTimeout(()=> $('scanError').classList.remove('show'), 3000);
  }
  else if(e.code === 'KeyL'){
    cancelDoorTimer();
    $('scanError').classList.remove('show');
    showDoorOpen();   // 맨 마지막 화면("출입문 개방 완료" 팝업)으로 바로 이동
  }
  else if(e.code === 'Escape'){
    closePopups();
    cancelDoorTimer();
  }
});
</script>
